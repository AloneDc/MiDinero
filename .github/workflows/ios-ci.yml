name: iOS Xcode validation

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    name: Simulator / Xcode ${{ matrix.xcode }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.4', '26.2']
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check evidence parser and generated project
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -m compileall -q scripts
          python3 scripts/verify_static.py
          python3 scripts/check_repository_security.py
      - name: Build, discover and execute tests with installed Xcode
        run: python3 scripts/ci/validate_xcode.py

      - name: Preserve Xcode evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-evidence-${{ matrix.xcode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence/
          if-no-files-found: error
          retention-days: 14

  device:
    name: Unsigned iPhone Release archive / Xcode 26.2
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check project and repository hygiene
        run: |
          python3 scripts/verify_static.py
          python3 scripts/check_repository_security.py
      - name: Build and archive for device without signing credentials
        run: python3 scripts/ci/validate_device.py
      - name: Preserve unsigned archive and structural evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/device-evidence/
          if-no-files-found: error
          retention-days: 14
