name: iOS Xcode validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    name: Build and test on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check evidence parser and generated project
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/verify_static.py
      - name: Build, discover and execute tests with installed Xcode
        run: python3 scripts/ci/validate_xcode.py

      - name: Preserve Xcode evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence/
          if-no-files-found: error
          retention-days: 14
